<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile — A&Z Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white shadow border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html" style="color:#e84393;">A&Zstore<span>.</span></a>
    <!-- остальное меню как в других страницах -->
  </div>
</nav>

<div class="container py-5">
  <h1 class="mb-4">My Profile</h1>
  <div class="card p-4">
    <p><strong>Username:</strong> <span id="profileName"></span></p>
    <p><strong>Email:</strong> <span id="profileEmail"></span></p>
    <button id="logoutBtn" class="btn btn-dark mt-3">Log out</button>
  </div>
</div>

<script src="main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const CURRENT_USER_KEY = 'az_current_user';
  const data = localStorage.getItem(CURRENT_USER_KEY);
  if (!data) {
    window.location.href = 'register.html';
    return;
  }

  const user = JSON.parse(data);
  document.getElementById('profileName').textContent  = user.username;
  document.getElementById('profileEmail').textContent = user.email;

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(CURRENT_USER_KEY);
    window.location.href = 'register.html';
  });
});
</script>
</body>
</html>
