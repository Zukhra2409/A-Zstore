<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placing an order — A&Z Store</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="super.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <style>
    body {
      background: #fff5f9;
      font-size: 1.6rem;
    }

    .order-container {
      max-width: 700px;
      margin: 80px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #e84393;
      margin-bottom: 30px;
      font-weight: 700;
    }

    label {
      font-size: 1.6rem;
      margin-bottom: .5rem;
      color: #333;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1.4rem;
      margin-bottom: 20px;
    }

    input[type="radio"] {
      margin-right: 8px;
      accent-color: #e84393;
    }

    button[type="submit"] {
      background: #e84393;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1.6rem;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button[type="submit"]:hover {
      background: #333;
    }
  </style>
</head>
<body>

<div id="toast"
     class="position-fixed bottom-0 end-0 m-3 alert alert-dark shadow"

      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-center">
  <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

  </li>
</ul>
    </div>
  </div>
</nav>

<div class="order-container">
  <h2>Your order</h2>

  <form id="orderForm">

    <label>Your name</label>
    <input type="text" placeholder="Write your name" required>

    <label>Your phone number</label>
    <input type="tel" placeholder="+7 (000) 000-00-00" required>

    <label>Recipient's name</label>
    <input type="text" placeholder="Write recipient's name" required>

    <label>Recipient's phone number</label>
    <input type="tel" placeholder="+7 (000) 000-00-00" required>

    <label>Please indicate the city for flower delivery:</label>
    <select required>
      <option>Astana</option>
      <option>Almaty</option>
      <option>Shymkent</option>
      <option>Another city</option>
    </select>

    <label>Delivery address</label>
    <input type="text" placeholder="Address, entrance, apartment" required>

    <label>Delivery date</label>
    <input type="date" id="date" required>

    <label>Postcard text or order comment</label>
    <textarea rows="4" placeholder="Suggestions or comments"></textarea>

    <label class="form-label">Select delivery terms</label>
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="delivery" id="deliveryCourier" value="courier" checked>
      <label class="form-check-label" for="deliveryCourier">
        Delivery by courier
      </label>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="radio" name="delivery" id="deliveryPickup" value="pickup">
      <label class="form-check-label" for="deliveryPickup">
        Pickup from store
      </label>
    </div>

    <label class="form-label">Payment method</label>
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="payment" id="payManager" value="manager" checked>
      <label class="form-check-label" for="payManager">
        Payment via manager (Visa, MasterCard, PayPal и др.)
      </label>
    </div>
    <div class="form-check mb-4">
      <input class="form-check-input" type="radio" name="payment" id="payKaspi" value="kaspi">
      <label class="form-check-label" for="payKaspi">
        Payment via Kaspi.kz
      </label>
    </div>

    <button type="submit">Place an order</button>
  </form>
</div>

<footer class="bg-dark text-white text-center py-4 mt-5">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
    <p class="mb-0 text-center">

    </p>

    <span id="currentDateTimeFooter" style="font-size:1.4rem;"></span>

    <button id="showTimeButton" class="btn btn-dark">Show Current Time</button>
  </div>
</footer>

</body>
