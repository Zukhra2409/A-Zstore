<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register — A&Z Store</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="super.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <style>
    body {
      margin: 0;
      background: linear-gradient(to right, #ffe6f0, #fff);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-wrap {
      flex: 1;
      display: flex;
      justify-content: center;  
      align-items: center;
      padding: 2rem;
    }

    .form-wrapper {
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 350px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-switch {
      display: flex;
      justify-content: space-around;
      margin-bottom: 1rem;
    }

    .form-switch button {
      flex: 1;
      padding: 1rem;
      background: none;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .form-switch button.active {
      color: #e84393;
      border-bottom: 2px solid #e84393;
    }

    .form {
      display: none;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form.active {
      display: flex;
    }

    .form input {
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 1rem;
    }

    .form button[type="submit"] {
      padding: 1rem;
      border: none;
      border-radius: 0.5rem;
      background: #e84393;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .form button[type="submit"]:hover {
      background: #333;
    }

    .error {
      color: #e63946;
      font-size: 0.85rem;
      min-height: 1em;
    }

    .success {
      color: #2a9d8f;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 10px;
    }

    input.invalid {
      border-color: #e63946;
      box-shadow: 0 0 4px rgba(230,57,70,0.3);
    }
  </style>
</head>
<body>

<div id="toast"
     class="position-fixed bottom-0 end-0 m-3 alert alert-dark shadow"
     style="display:none; z-index:9999; min-width:200px; max-width:260px; font-size:14px;">
</div>

<nav class="navbar navbar-expand-lg bg-white shadow border-bottom" style="padding:10px 0;">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html" style="color:#e84393; font-size:2rem;">A&Zstore<span>.</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-center">
  <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
  <li class="nav-item"><a class="nav-link" href="product.html">Products</a></li>
  <li class="nav-item">
    <a class="nav-link d-flex align-items-center" href="favorites.html">
      Favorites
      <span id="favCount" class="badge bg-dark ms-1 rounded-pill">0</span>
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link d-flex align-items-center" href="cart.html">
      Cart
      <span id="cartCount" class="badge bg-dark ms-1 rounded-pill">0</span>
    </a>
  </li>

  <li class="nav-item"><a class="nav-link" href="order.html">Order</a></li>
  <li class="nav-item"><a class="nav-link" href="register.html">Login</a></li>
  <li class="nav-item ms-2">
    <button id="themeBtn" class="btn btn-outline-dark btn-sm px-3">🌙 Night Mode</button>
  </li>
</ul>
    </div>
  </div>
</nav>

<div class="page-wrap">
  <div class="form-wrapper">
    <div class="form-switch">
      <button id="loginBtn" class="active">Login</button>
      <button id="registerBtn">Register</button>
    </div>

    <form class="form active" id="loginForm">
      <input type="text" id="loginUser" placeholder="Username">
      <input type="password" id="loginPass" placeholder="Password">
      <button type="submit">Login</button>
    </form>

    <form class="form" id="registerForm">
      <input type="text" id="regUser" placeholder="Username">
      <small class="error"></small>

      <input type="email" id="regEmail" placeholder="Email">
      <small class="error"></small>

      <input type="password" id="regPass" placeholder="Password">
      <small class="error"></small>

      <input type="password" id="regConfirm" placeholder="Confirm Password">
      <small class="error"></small>

      <button type="submit">Register</button>
      <p id="successMsg" class="success" hidden>Registration successful!</p>
    </form>
  </div>
</div>

<footer class="bg-dark text-white text-center py-4 mt-auto">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
    <p class="mb-0 text-center">
      Created by <b>Zukhra &amp; Akniyet</b> | SE-2409 | A&amp;Z Store
    </p>

    <span id="currentDateTimeFooter" style="font-size:1.4rem;"></span>

    <button id="showTimeButton" class="btn btn-dark">Show Current Time</button>
  </div>
</footer>

<script src="main.js"></script>
</body>
</html>
